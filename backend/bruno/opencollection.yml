opencollection: 1.0.0

info:
  name: zmykamy.pl
  version: "1"

request:
  headers:
    - name: Origin
      value: "{{baseUrl}}"
    - name: X-Device-Name
      value: Bruno
  scripts:
    - type: before-request
      code: |-
        const token = bru.getVar("token");
        if (token) {
          req.setHeader("Authorization", `Bearer ${token}`);
        }
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
    presets:
      defaultEnvironment: local
