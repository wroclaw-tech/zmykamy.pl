info:
  name: Get plan
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/trips/{{tripId}}/plan"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Any trip member. Returns `{ points, info }`.

  - `points`: ordered by date and time
  - `info`: general info cards, ordered by creation
