info:
  name: Create info card
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/trips/{{tripId}}/plan/info"
  body:
    type: json
    data: |-
      {
        "title": "Nocleg",
        "text": "Mieszkanie w Alfamie, Rua dos Remédios 4",
        "icon": "bed"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body?.id) {
          bru.setVar("infoId", res.body.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Any trip member. The returned id is saved as `infoId`.

  - `title`: 1-60 characters
  - `text`: up to 4000 characters, defaults to empty
  - `icon`: one of the plan icons, defaults to `info`
