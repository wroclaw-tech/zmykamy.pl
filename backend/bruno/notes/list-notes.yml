info:
  name: List notes
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/trips/{{tripId}}/notes"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Any trip member. Returns `{ notes }`, pinned first, then recently updated.
