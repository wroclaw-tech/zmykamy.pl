info:
  name: Update note
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/trips/{{tripId}}/notes/{{noteId}}"
  body:
    type: json
    data: |-
      {
        "pinned": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  The author or an organizer. Any of the create fields, at least one.
