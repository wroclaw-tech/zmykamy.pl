info:
  name: Update trip
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/trips/{{tripId}}"
  body:
    type: json
    data: |-
      {
        "name": "Sylwek w Lizbonie",
        "currency": "PLN"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Organizer only. All create fields are optional, at least one is required.

  - `coverImageKey`: key returned by "Get cover upload url" after uploading the image, or null to remove the cover
