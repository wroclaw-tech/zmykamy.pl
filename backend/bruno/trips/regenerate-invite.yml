info:
  name: Regenerate invite
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/trips/{{tripId}}/invite/regenerate"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body?.code) {
          bru.setVar("inviteCode", res.body.code);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Organizer only. The previous code stops working immediately. Returns `{ code, url }`.
