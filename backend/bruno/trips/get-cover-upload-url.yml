info:
  name: Get cover upload url
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/trips/{{tripId}}/cover/upload-url"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Organizer only. Returns `{ uploadUrl, key }`. PUT a JPEG to `uploadUrl` with `Content-Type: image/jpeg` within 5 minutes, then send `{ "coverImageKey": key }` with "Update trip".
