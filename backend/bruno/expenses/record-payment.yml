info:
  name: Record payment
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/trips/{{tripId}}/settlement/payments"
  body:
    type: json
    data: |-
      {
        "fromUserId": "{{userId}}",
        "toUserId": "{{otherUserId}}",
        "amount": 124333
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body?.payments?.[0]) {
          bru.setVar("paymentId", res.body.payments[0].id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  The payer, the recipient or an organizer. Marks a transfer as paid and returns the updated settlement with `201`.
