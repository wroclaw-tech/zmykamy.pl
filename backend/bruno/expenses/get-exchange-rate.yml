info:
  name: Get exchange rate
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/trips/{{tripId}}/exchange-rate?currency=PLN&date=2027-05-13"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Any trip member. Returns `{ from, to, rate, effectiveDate, table }`: the NBP mid rate converting one unit of `currency` into the trip currency.

  - `currency`: ISO code
  - `date`: optional YYYY-MM-DD, defaults to today; the last table published on or before it is used (future dates use the latest one)

  - `table`: `A` or `B`, `A/B` when a cross rate uses both tables, or `null` for the same currency
