info:
  name: List expenses
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/trips/{{tripId}}/expenses"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Any trip member. Returns `{ expenses }`, newest day first.

  Each expense is `{ id, title, amount, date, icon, paidBy, shares, author, createdAt }`; amounts are minor units of the trip currency.
