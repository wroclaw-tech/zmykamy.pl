info:
  name: List documents
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/trips/{{tripId}}/documents"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Any trip member. Returns `{ documents }`, oldest first, with a presigned `fileUrl` for files.
