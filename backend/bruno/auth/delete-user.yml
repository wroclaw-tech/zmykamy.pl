info:
  name: Delete user
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/auth/delete-user"
  body:
    type: json
    data: |-
      {
        "password": "{{password}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Permanently deletes the account with its sessions and linked accounts.
