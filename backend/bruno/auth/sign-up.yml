info:
  name: Sign up
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/sign-up/email"
  body:
    type: json
    data: |-
      {
        "name": "{{name}}",
        "email": "{{email}}",
        "password": "{{password}}",
        "themePalette": "ocean",
        "termsVersion": "2026-10"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body?.token) {
          bru.setVar("token", res.body.token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
