info:
  name: List media
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/trips/{{tripId}}/media"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Any trip member. Returns `{ media }`, newest first, with presigned `url` and `thumbnailUrl`.
