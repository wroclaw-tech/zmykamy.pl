name: zmykamy

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zmykamy
      POSTGRES_PASSWORD: zmykamy
      POSTGRES_DB: zmykamy
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zmykamy -d zmykamy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
