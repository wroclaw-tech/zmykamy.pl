name: zmykamy

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zmykamy
      POSTGRES_PASSWORD: zmykamy
      POSTGRES_DB: zmykamy
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zmykamy -d zmykamy"]
      interval: 5s
      timeout: 5s
      retries: 5

  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    ports:
      - "${S3_PORT:-3900}:3900"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage

  garage-init:
    image: alpine:3.22
    depends_on:
      - garage
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: zmykamy-local-admin
      S3_BUCKET: zmykamy
      S3_ACCESS_KEY_ID: GK2932f05c21e2b35c1d138b0b
      S3_SECRET_ACCESS_KEY: b17f83e5929611ed071b5255cd9b2ec996354badd0898f64c00e7fb562f6ac34
    volumes:
      - ./garage/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]

volumes:
  postgres-data:
  garage-data:
